{% extends "base.html" %}

{% block content %}
<div class="post-entry">
    <h2>{{ post.title }}</h2>
    <p class="post-author">By {{ post.author.username }}</p>
    <p>{{ post.body|linebreaks }}</p>
</div>
{% if user == post.author %}
    <div>
        <p><a href="{% url 'post_edit' post.pk %}">Edit post</a></p>
        <p><a href="{% url 'post_delete' post.pk %}">Delete post</a></p>
    </div>
{% endif %}
{% endblock content %}
